name: Notify MCP

# kyxap1/pedals-mcp indexes these manuals. Only a manual changing invalidates
# that index, so a README or workflow edit must not trigger a rebuild.
on:
  push:
    branches: [master]
    paths: ['*/index.html']
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch rather than repository_dispatch: the token then needs
      # Actions: write alone, which cannot push to pedals-mcp or read its code.
      - name: Trigger a rebuild
        env:
          GH_TOKEN: ${{ secrets.MCP_DISPATCH_TOKEN }}
        run: gh workflow run rebuild.yml --repo kyxap1/pedals-mcp --ref master
