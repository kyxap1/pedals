<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedal Manuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap"
    />
    <style>
      :root {
        --ink: #1f1f26;
        --charcoal: #1b1b21;
        --paper: #f4f4f6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: #fff;
        font-family: "Chakra Petch", system-ui, sans-serif;
        line-height: 1.55;
      }
      header {
        background: var(--charcoal);
        color: #fff;
        padding: 2.75rem 1.5rem 2.5rem;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        font-size: clamp(1.7rem, 4vw, 2.7rem);
        margin: 0;
      }
      header p {
        margin: 0.6rem 0 0;
        opacity: 0.82;
        font-size: 1rem;
      }
      main {
        padding: 2.5rem 1.5rem 4rem;
      }
      ul.pedals {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      .pedals a {
        display: block;
        height: 100%;
        padding: 1.35rem 1.4rem;
        text-decoration: none;
        color: inherit;
        background: var(--paper);
        border-left: 4px solid var(--charcoal);
        transition: transform 0.12s ease;
      }
      .pedals a:hover {
        transform: translateY(-2px);
      }
      .brand {
        display: block;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        opacity: 0.58;
      }
      .model {
        display: block;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 1.2rem;
        margin: 0.2rem 0 0.55rem;
      }
      .note {
        display: block;
        font-size: 0.88rem;
        opacity: 0.72;
      }
      footer {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 1.5rem 3rem;
        font-size: 0.85rem;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Pedal Manuals</h1>
        <p>Personal collection of guitar effects pedal manuals, rendered as lightweight HTML.</p>
      </div>
    </header>
    <main class="wrap">
      <ul class="pedals">
        <li>
          <a href="wampler-terraform/">
            <span class="brand">Wampler</span>
            <span class="model">Terraform</span>
            <span class="note">Modulation multi-effect &middot; 2023 manual + v1 addendum</span>
          </a>
        </li>
      </ul>
    </main>
    <footer>More pedals added over time.</footer>
  </body>
</html>
